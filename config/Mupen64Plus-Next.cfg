# Mupen64Plus-Next.cfg v4.6 · Tier 2 N64 frontend pins · tvOS software stack: angrylion sw-RDP + cxd4 RSP, no JIT + cached_interpreter (DYNAREC undef → matches no-JIT default; drift-guard against DYNAREC builds) · 8 keys · paired with retroarch-appletv4k v4.6

# === Video (threading, frame delay) ===
# video_threaded=false (#14978 closed — drift-guard, equals global); video_frame_delay_auto=false (real override, global true; #14201 closed — kept as regression guard)
video_threaded = "false"
video_frame_delay_auto = "false"

# === Audio ===
# audio_sync=true (DRC <0.5% pitch shift); audio_latency=64 (explicit Tier 2 pin; equals global 64 since companion v4.1 — held against global drift)
audio_sync = "true"
audio_latency = "64"

# === Latency / Run Ahead ===
# run_ahead_enabled=false (per-frame savestate cost unaffordable on the sw-RDP stack; per-game opt-in).
# Both run_ahead keys equal global — drift-guards, not flips.
run_ahead_enabled = "false"
run_ahead_secondary_instance = "false"

# === Saves / Savestates ===
# autosave_interval=0 (kills purgeable-cache stall on SRAM write — real override);
# rewind_enable=false (#18300 closed — drift-guard, equals global)
autosave_interval = "0"
rewind_enable = "false"
